(async()=>{
const SB_URL='https://rwcbtfkkymxvuenysgtg.supabase.co', SB_KEY='sb_publishable_Pp23u8hGUPWrnJn685dhyg_VKfetQ2J';
const el=id=>document.getElementById(id),show=(title,message,icon='🔐')=>{el('title').textContent=title;el('message').textContent=message;el('icon').textContent=icon};
const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
const error=query.get('error_description')||hash.get('error_description')||query.get('error')||hash.get('error');
if(error){history.replaceState(null,'',location.pathname);show('Link invalid or expired',error,'❌');return}

const client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{detectSessionInUrl:false,persistSession:false,autoRefreshToken:false}});
try{
 let session=null;
 if(hash.get('access_token')&&hash.get('refresh_token')){
   const r=await client.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(r.error)throw r.error;session=r.data.session;
 }else if(query.get('token_hash')&&query.get('type')==='recovery'){
   const r=await client.auth.verifyOtp({token_hash:query.get('token_hash'),type:'recovery'});if(r.error)throw r.error;session=r.data.session;

 }
 history.replaceState(null,'',location.pathname);

 show('Choose a new password','Enter and confirm your new WobbleLift password.');el('form').style.display='block';

}catch(e){history.replaceState(null,'',location.pathname);show('Recovery unsuccessful',e.message||'Please request another password reset email.','❌')}
})();
</script></body></html>
