<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WobbleLift | Email Verification</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: linear-gradient(160deg, #101b30, #172c48);
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

.card {
  width: 100%;
  max-width: 440px;
  padding: 40px 25px;
  border: 1px solid #465c77;
  border-radius: 22px;
  background: #1c3049;
  box-shadow: 0 15px 45px #0005;
}

.logo {
  font-size: 36px;
  font-weight: 900;
  color: #ffd76a;
  margin-bottom: 12px;
}

.icon {
  font-size: 65px;
  margin: 22px 0;
}

h1 {
  font-size: 25px;
  margin: 15px 0;
}

p {
  color: #c8d5e5;
  font-size: 16px;
  line-height: 1.7;
}

.footer {
  margin-top: 30px;
  font-size: 12px;
  color: #91a6c0;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">🚁 WobbleLift</div>

  <div class="icon" id="icon">⏳</div>

  <h1 id="title">Checking confirmation...</h1>

  <p id="message">
    Please wait while we check your email confirmation.
  </p>

  <div class="footer">
    WobbleLift • Reach for the sky!
  </div>
</div>

<script>
(function () {
  const hash = new URLSearchParams(
    window.location.hash.substring(1)
  );

  const query = new URLSearchParams(
    window.location.search
  );

  const icon = document.getElementById("icon");
  const title = document.getElementById("title");
  const message = document.getElementById("message");

  function show(symbol, heading, description) {
    icon.textContent = symbol;
    title.textContent = heading;
    message.textContent = description;
  }

  const error =
    hash.get("error") ||
    query.get("error");

  const errorDescription =
    hash.get("error_description") ||
    query.get("error_description");

  const accessToken = hash.get("access_token");
  const tokenType = hash.get("token_type");
  const refreshToken = hash.get("refresh_token");
  const confirmationType = hash.get("type");

  // Remove sensitive authentication values from the URL.
  if (
    window.location.hash ||
    window.location.search
  ) {
    history.replaceState(
      null,
      "",
      window.location.pathname
    );
  }

  if (error) {
    show(
      "❌",
      "Confirmation unsuccessful",
      errorDescription ||
      "Your confirmation link may have expired. Please return to WobbleLift and request another email."
    );
    return;
  }

  if (
    accessToken &&
    refreshToken &&
    tokenType === "bearer" &&
    confirmationType === "signup"
  ) {
    show(
      "✅",
      "Email Verified!",
      "Your WobbleLift account has been confirmed. You can now return to the game and log in!"
    );
    return;
  }

  show(
    "ℹ️",
    "Confirmation not detected",
    "No completed email confirmation was detected. Please open the confirmation link from your WobbleLift registration email."
  );
})();
</script>

</body>
</html>
